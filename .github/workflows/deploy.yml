name: Deploy

# dev  -> staging backend + site published under /staging/
# prod -> production backend + site published at the root
#
# Backend deploys BEFORE the frontend, so a still-cached old frontend talks to a backend
# that already understands the new contract (expand/contract). The two platforms cannot be
# made atomic, so contract changes must stay backward-compatible for one release cycle.
#
# The site job lives in site.yml, shared with publish-lists.yml: a save on the dashboard's
# Config tab republishes the site alone, without redeploying the backend.

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one publish at a time. Never cancel in flight — a cancelled deploy can
# leave the site serving a half-assembled artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Apps Script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is not set — backend cannot deploy."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      # .clasp.json is GENERATED from the secret, never copied from a committed file —
      # so the script id has exactly one source of truth and cannot drift.
      - name: Select environment
        id: env
        env:
          SCRIPT_ID: ${{ github.ref_name == 'prod' && secrets.PROD_SCRIPT_ID || secrets.STAGING_SCRIPT_ID }}
        run: |
          if [ -z "$SCRIPT_ID" ]; then
            echo "::error::SCRIPT_ID secret is not set for ${{ github.ref_name }}."
            exit 1
          fi
          printf '{\n  "scriptId": "%s",\n  "rootDir": "./backend"\n}\n' "$SCRIPT_ID" > .clasp.json

          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "name=production"                                   >> "$GITHUB_OUTPUT"
            echo "deployment_id=${{ secrets.PROD_DEPLOYMENT_ID }}"   >> "$GITHUB_OUTPUT"
            echo "web_app_url=${{ secrets.PROD_WEB_APP_URL }}"       >> "$GITHUB_OUTPUT"
          else
            echo "name=staging"                                       >> "$GITHUB_OUTPUT"
            echo "deployment_id=${{ secrets.STAGING_DEPLOYMENT_ID }}" >> "$GITHUB_OUTPUT"
            echo "web_app_url=${{ secrets.STAGING_WEB_APP_URL }}"     >> "$GITHUB_OUTPUT"
          fi

      - name: Push source
        run: npx clasp push -f

      # -i redeploys IN PLACE so the Web App URL never changes. Without it clasp mints a new
      # URL, which then has to be updated in .env and in the secrets before anything works.
      - name: Redeploy in place
        run: |
          ID="${{ steps.env.outputs.deployment_id }}"
          if [ -z "$ID" ]; then
            echo "::error::${{ steps.env.outputs.name }} deployment id variable is not set."
            exit 1
          fi
          npx clasp deploy -i "$ID" --description "${{ github.ref_name }} ${{ github.sha }}"

      # The spreadsheet and photo-folder bindings live in the project's Script Properties,
      # not in this repo. They used to be set by hand in the Apps Script UI, which meant two
      # uncontrolled copies of each id and nothing keeping them in step. Pushing them here
      # makes the secrets authoritative — the same values, applied every deploy.
      # GITHUB_REPOSITORY and DISPATCH_TOKEN are what a Config-tab save uses to ask GitHub
      # to republish the lists (publish-lists.yml). The repository comes from the runner's
      # default environment; the token is one shared secret, named without the GITHUB_
      # prefix because secret names may not carry it.
      #
      # ADMIN_TOKEN is deliberately NOT pushed: this endpoint authenticates *with* it, so it
      # cannot bootstrap itself. It stays a manual Script Property. That also means a brand
      # new environment needs its ADMIN_TOKEN set by hand before its first deploy.
      # An in-place redeploy is not instantly live. For several minutes afterwards the exec
      # URL can answer with Google's generic "unable to open the file" HTML page instead of
      # running the script, and it can flap between the old and new version. Every later
      # step calls the web app, so wait for three consecutive JSON answers first.
      - name: Wait for the redeployed web app to serve
        env:
          URL: ${{ steps.env.outputs.web_app_url }}
          TOKEN: ${{ github.ref_name == 'prod' && secrets.PROD_ADMIN_TOKEN || secrets.STAGING_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          OK=0
          for ATTEMPT in $(seq 1 30); do
            OUT=$(curl -sL --max-time 60 --get "$URL" \
                    --data-urlencode "action=ping" --data-urlencode "token=$TOKEN" || true)
            if echo "$OUT" | grep -q '"status":"ok"'; then
              OK=$((OK + 1))
              echo "attempt $ATTEMPT: serving ($OK/3)"
              [ "$OK" -ge 3 ] && exit 0
              sleep 10
            elif echo "$OUT" | grep -q '"status":"error"'; then
              echo "$OUT"
              echo "::error::the web app is serving but rejected the request — is the admin token current?"
              exit 1
            else
              OK=0
              echo "attempt $ATTEMPT: not serving JSON yet, waiting 15s"
              sleep 15
            fi
          done
          echo "::error::the web app did not settle within the wait — it may still be redeploying, or the deployment is broken. Re-run once before investigating."
          exit 1

      - name: Reconcile Script Properties
        env:
          URL: ${{ steps.env.outputs.web_app_url }}
          TOKEN: ${{ github.ref_name == 'prod' && secrets.PROD_ADMIN_TOKEN || secrets.STAGING_ADMIN_TOKEN }}
          SPREADSHEET_FOLDER_ID: ${{ github.ref_name == 'prod' && secrets.PROD_SPREADSHEET_FOLDER_ID || secrets.STAGING_SPREADSHEET_FOLDER_ID }}
          PHOTO_FOLDER_ID: ${{ github.ref_name == 'prod' && secrets.PROD_PHOTO_FOLDER_ID || secrets.STAGING_PHOTO_FOLDER_ID }}
          ALERT_RECIPIENTS: ${{ github.ref_name == 'prod' && secrets.PROD_ALERT_RECIPIENTS || secrets.STAGING_ALERT_RECIPIENTS }}
          ALERT_FROM: ${{ github.ref_name == 'prod' && secrets.PROD_ALERT_FROM || secrets.STAGING_ALERT_FROM }}
          SUPPORT_RECIPIENTS: ${{ github.ref_name == 'prod' && secrets.PROD_SUPPORT_RECIPIENTS || secrets.STAGING_SUPPORT_RECIPIENTS }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/webapp.sh
          if [ -z "$TOKEN" ]; then
            echo "::error::admin token secret is not set for ${{ steps.env.outputs.name }}."
            exit 1
          fi
          for KEY in SPREADSHEET_FOLDER_ID PHOTO_FOLDER_ID ALERT_RECIPIENTS SUPPORT_RECIPIENTS ALERT_FROM GITHUB_REPOSITORY DISPATCH_TOKEN; do
            VALUE="${!KEY}"
            if [ -z "$VALUE" ] && [ "$KEY" != ALERT_FROM ]; then
              echo "::error::${{ steps.env.outputs.name }} $KEY secret is not set."
              exit 1
            fi
            OUT=$(webapp_get setScriptProperty "key=$KEY" "value=$VALUE") \
              || { echo "::error::could not set $KEY — the web app never answered with JSON."; exit 1; }
            if [ "$(webapp_field "$OUT" .status)" != ok ]; then
              echo "$OUT"
              echo "::error::could not set $KEY — the web app rejected the request ($(webapp_field "$OUT" .message)); is the admin token current?"
              exit 1
            fi
            if [ -n "$VALUE" ]; then echo "set $KEY"; else echo "cleared $KEY (secret is empty)"; fi
          done

      # The Reference sheet: created and seeded on the first run, repaired on every run
      # (init is idempotent and never overwrites a populated tab). Then the lists it serves,
      # which the site job publishes, must all be non-empty.
      - name: Create and seed the reference store
        env:
          URL: ${{ steps.env.outputs.web_app_url }}
          TOKEN: ${{ github.ref_name == 'prod' && secrets.PROD_ADMIN_TOKEN || secrets.STAGING_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/webapp.sh
          OUT=$(webapp_get init) \
            || { echo "::error::init never answered with JSON."; exit 1; }
          [ "$(webapp_field "$OUT" .status)" = ok ] \
            || { echo "$OUT"; echo "::error::init failed: $(webapp_field "$OUT" .message)"; exit 1; }
          REF_URL=$(webapp_field "$OUT" .reference.url)
          REF=$(webapp_get reference) \
            || { echo "::error::reference never answered with JSON."; exit 1; }
          [ "$(webapp_field "$REF" .status)" = ok ] \
            || { echo "$REF"; echo "::error::reference failed: $(webapp_field "$REF" .message)"; exit 1; }
          {
            echo "### ${{ steps.env.outputs.name }} reference lists"
            echo "- version $(webapp_field "$REF" .version), from the $(webapp_field "$REF" .source)"
            echo "- [Reference sheet]($REF_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          for LIST in kitchens stores dishes supervisors drivers; do
            N=$(jq -r --arg l "$LIST" '(.[$l] // []) | length' <<<"$REF")
            [ "$N" -gt 0 ] || { echo "::error::the reference store has no $LIST."; exit 1; }
            echo "$LIST: $N"
            echo "- $LIST: $N" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Verify deployment is live and bound to the right store
        env:
          URL: ${{ steps.env.outputs.web_app_url }}
          TOKEN: ${{ github.ref_name == 'prod' && secrets.PROD_ADMIN_TOKEN || secrets.STAGING_ADMIN_TOKEN }}
          SPREADSHEET_FOLDER_ID: ${{ github.ref_name == 'prod' && secrets.PROD_SPREADSHEET_FOLDER_ID || secrets.STAGING_SPREADSHEET_FOLDER_ID }}
        run: |
          set -euo pipefail
          source .github/scripts/webapp.sh
          OUT=$(webapp_get ping) \
            || { echo "::error::ping never answered with JSON — the deployment is not serving."; exit 1; }
          echo "$OUT"
          [ "$(webapp_field "$OUT" .status)" = ok ] \
            || { echo "::error::ping did not return ok."; exit 1; }

          # The monthly store: the folder this deploy is bound to and the current month's file
          # name. The file itself is created by the first record written in the month.
          [ "$(webapp_field "$OUT" .folder_id)" = "$SPREADSHEET_FOLDER_ID" ] \
            || { echo "::error::deployment is bound to a different operations folder than the ${{ steps.env.outputs.name }} secret specifies ($(jq -r '.folder_error // "no folder_error"' <<<"$OUT"))."; exit 1; }
          EXPECTED="$(TZ=America/New_York date +%Y-%m) Operations"
          [ "$(webapp_field "$OUT" .current_month.name)" = "$EXPECTED" ] \
            || { echo "::error::current month file is not '$EXPECTED'."; exit 1; }
          MONTH_URL=$(webapp_field "$OUT" .current_month.url)

          MAIL=$(webapp_get mailStatus) || MAIL='{}'
          ALERT_TO=$(jq -r '(.alert_recipients // []) | join(", ")' <<<"$MAIL")
          SUPPORT_TO=$(jq -r '(.support_recipients // []) | join(", ")' <<<"$MAIL")
          ALERT_FROM_SET=$(webapp_field "$MAIL" .alert_from)
          if [ -n "$ALERT_FROM_SET" ] && [ "$(webapp_field "$MAIL" .alert_from_usable)" != true ]; then
            echo "::warning::$(webapp_field "$MAIL" .alert_from_note)"
            ALERT_FROM_LABEL="$ALERT_FROM_SET (alias not verified, sending as the account)"
          else
            ALERT_FROM_LABEL="${ALERT_FROM_SET:-the deploying account}"
          fi

          {
            echo "### ${{ steps.env.outputs.name }} storage"
            echo "- violation alerts to: ${ALERT_TO:-none configured}"
            echo "- system mail to: ${SUPPORT_TO:-none configured}"
            echo "- alerts from: $ALERT_FROM_LABEL"
            if [ -n "$MONTH_URL" ]; then
              echo "- current month: [$EXPECTED]($MONTH_URL)"
            else
              echo "- current month: $EXPECTED (not created yet; appears with the month's first record)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Reads can succeed while writes fail, so only real writes prove the deployment can
      # reach its stores: one production row, then one delivery row. The two kinds share the
      # dispatch but not the schema, tab or legacy writer. Staging only: production has no
      # write-then-clean endpoint, so a synthetic row there would pollute the HACCP record.
      # Rows are dated today in New York so they file into the current month, and each tab
      # must grow by exactly one row: that is what proves the write reached the monthly store
      # and not only the legacy sheet. Each write is sent once; if its reply is Google's
      # error page, the row count decides whether it landed. Last, one config write against
      # the reserved store row proves the reference store's write path and its cache.
      - name: Verify writes (staging only)
        if: github.ref_name == 'dev'
        env:
          URL: ${{ steps.env.outputs.web_app_url }}
          TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/webapp.sh
          tab_rows() {
            local out
            out=$(webapp_get storageStatus) || return 1
            jq -r --arg tab "$1" '.months[0].rows[$tab] // 0' <<<"$out"
          }
          # smoke_write <tab> <payload file>: one write, after which the tab has exactly one more row.
          smoke_write() {
            local tab=$1 file=$2 before after out
            before=$(tab_rows "$tab") \
              || { echo "::error::storageStatus never answered with JSON."; return 1; }
            if out=$(webapp_post "$file"); then
              echo "$out"
              [ "$(webapp_field "$out" .status)" = ok ] \
                || { echo "::error::staging $tab write failed — backend accepted no data."; return 1; }
            else
              echo "::warning::the $tab write's reply was not JSON; the row count decides whether it landed."
            fi
            after=$(tab_rows "$tab") \
              || { echo "::error::storageStatus never answered with JSON after the $tab write."; return 1; }
            [ "$after" -eq "$((before + 1))" ] \
              || { echo "::error::the monthly $tab tab went $before -> $after instead of growing by one; the write did not reach the monthly store."; return 1; }
            echo "monthly $tab rows: $before -> $after"
          }
          # Payloads come from the same builders the test scripts use, mirroring the forms.
          node scripts/smoke-payload.js production tag=ZZ-CI-SMOKE > production.json
          smoke_write Production production.json
          echo "production submission $(jq -r '.rows[0].submissionId' production.json)"

          node scripts/smoke-payload.js delivery tag=ZZ-CI-SMOKE store=0000 \
            "note=CI smoke test run ${{ github.run_id }} - safe to delete" > delivery.json
          smoke_write Deliveries delivery.json
          DELIVERY_ID=$(jq -r '.rows[0].submissionId' delivery.json)
          echo "delivery submission $DELIVERY_ID"

          # Read it back: growth proves the write landed, the read-back proves it is findable.
          BACK=$(webapp_get queryDeliveries "submissionId=$DELIVERY_ID") \
            || { echo "::error::queryDeliveries never answered with JSON."; exit 1; }
          [ "$(webapp_field "$BACK" .matched)" = 1 ] \
            || { echo "::error::the smoke row is not readable back by its submission id ($(webapp_field "$BACK" .matched) matched)."; exit 1; }
          echo "read back 1 row for $DELIVERY_ID"

          # An update is idempotent, so webapp_post's single attempt is enough; publish:false
          # keeps a routine dev push from firing a second Pages publish behind itself. The
          # name carries the attempt as well as the run, so a re-run still changes something.
          BEFORE=$(webapp_get reference) \
            || { echo "::error::reference never answered with JSON."; exit 1; }
          jq -n --arg run "${{ github.run_id }}-${{ github.run_attempt }}" \
            '{type:"config", list:"stores", actor:"ci", publish:false,
              ops:[{op:"update", entry:{id:"00000000-0000-4000-8000-000000000000", name:("(reserved) CI smoke test " + $run)}}]}' > config.json
          OUT=$(webapp_post config.json) \
            || { echo "::error::the config write's reply was not JSON."; exit 1; }
          jq '{status, code, message, applied, version, published, publishError}' <<<"$OUT"
          [ "$(webapp_field "$OUT" .status)" = ok ] \
            || { echo "::error::the config write was rejected: $(webapp_field "$OUT" .message)"; exit 1; }
          [ "$(webapp_field "$OUT" .version)" != "$(webapp_field "$BEFORE" .version)" ] \
            || { echo "::error::the config write did not change the reference version; the cache was not invalidated."; exit 1; }
          echo "config write ok: $(webapp_field "$BEFORE" .version) -> $(webapp_field "$OUT" .version)"

  # ───────────────────────────────────────────────────────────────────────────────
  frontend:
    needs: backend
    uses: ./.github/workflows/site.yml
    secrets: inherit
