name: Deploy

# dev  -> staging backend + site published under /staging/
# prod -> production backend + site published at the root
#
# Backend deploys BEFORE the frontend, so a still-cached old frontend talks to a backend
# that already understands the new contract (expand/contract). The two platforms cannot be
# made atomic, so contract changes must stay backward-compatible for one release cycle.

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows one publish at a time. Never cancel in flight — a cancelled deploy can
# leave the site serving a half-assembled artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Apps Script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is not set — backend cannot deploy."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      # .clasp.json is GENERATED from the secret, never copied from a committed file —
      # so the script id has exactly one source of truth and cannot drift.
      - name: Select environment
        id: env
        env:
          SCRIPT_ID: ${{ github.ref_name == 'prod' && secrets.PROD_SCRIPT_ID || secrets.STAGING_SCRIPT_ID }}
        run: |
          if [ -z "$SCRIPT_ID" ]; then
            echo "::error::SCRIPT_ID secret is not set for ${{ github.ref_name }}."
            exit 1
          fi
          printf '{\n  "scriptId": "%s",\n  "rootDir": "./backend"\n}\n' "$SCRIPT_ID" > .clasp.json

          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "name=production"                                   >> "$GITHUB_OUTPUT"
            echo "deployment_id=${{ secrets.PROD_DEPLOYMENT_ID }}"   >> "$GITHUB_OUTPUT"
            echo "web_app_url=${{ secrets.PROD_WEB_APP_URL }}"       >> "$GITHUB_OUTPUT"
          else
            echo "name=staging"                                       >> "$GITHUB_OUTPUT"
            echo "deployment_id=${{ secrets.STAGING_DEPLOYMENT_ID }}" >> "$GITHUB_OUTPUT"
            echo "web_app_url=${{ secrets.STAGING_WEB_APP_URL }}"     >> "$GITHUB_OUTPUT"
          fi

      - name: Push source
        run: npx clasp push -f

      # -i redeploys IN PLACE so the Web App URL never changes. Without it clasp mints a new
      # URL, which then has to be updated in .env and in the secrets before anything works.
      - name: Redeploy in place
        run: |
          ID="${{ steps.env.outputs.deployment_id }}"
          if [ -z "$ID" ]; then
            echo "::error::${{ steps.env.outputs.name }} deployment id variable is not set."
            exit 1
          fi
          npx clasp deploy -i "$ID" --description "${{ github.ref_name }} ${{ github.sha }}"

      # The spreadsheet and photo-folder bindings live in the project's Script Properties,
      # not in this repo. They used to be set by hand in the Apps Script UI, which meant two
      # uncontrolled copies of each id and nothing keeping them in step. Pushing them here
      # makes the secrets authoritative — the same values, applied every deploy.
      #
      # ADMIN_TOKEN is deliberately NOT pushed: this endpoint authenticates *with* it, so it
      # cannot bootstrap itself. It stays a manual Script Property. That also means a brand
      # new environment needs its ADMIN_TOKEN set by hand before its first deploy.
      # An in-place redeploy is not instantly live. For several minutes afterwards the exec
      # URL can answer with Google's generic "unable to open the file" HTML page instead of
      # running the script, and it can flap between the old and new version. Every later
      # step calls the web app, so wait for three consecutive JSON answers first.
      - name: Wait for the redeployed web app to serve
        env:
          URL: ${{ steps.env.outputs.web_app_url }}
          TOKEN: ${{ github.ref_name == 'prod' && secrets.PROD_ADMIN_TOKEN || secrets.STAGING_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          OK=0
          for ATTEMPT in $(seq 1 30); do
            OUT=$(curl -sL --max-time 60 --get "$URL" \
                    --data-urlencode "action=ping" --data-urlencode "token=$TOKEN" || true)
            if echo "$OUT" | grep -q '"status":"ok"'; then
              OK=$((OK + 1))
              echo "attempt $ATTEMPT: serving ($OK/3)"
              [ "$OK" -ge 3 ] && exit 0
              sleep 10
            elif echo "$OUT" | grep -q '"status":"error"'; then
              echo "$OUT"
              echo "::error::the web app is serving but rejected the request — is the admin token current?"
              exit 1
            else
              OK=0
              echo "attempt $ATTEMPT: not serving JSON yet, waiting 15s"
              sleep 15
            fi
          done
          echo "::error::the web app did not settle within the wait — it may still be redeploying, or the deployment is broken. Re-run once before investigating."
          exit 1

      - name: Reconcile Script Properties
        env:
          URL: ${{ steps.env.outputs.web_app_url }}
          TOKEN: ${{ github.ref_name == 'prod' && secrets.PROD_ADMIN_TOKEN || secrets.STAGING_ADMIN_TOKEN }}
          SPREADSHEET_FOLDER_ID: ${{ github.ref_name == 'prod' && secrets.PROD_SPREADSHEET_FOLDER_ID || secrets.STAGING_SPREADSHEET_FOLDER_ID }}
          PHOTO_FOLDER_ID: ${{ github.ref_name == 'prod' && secrets.PROD_PHOTO_FOLDER_ID || secrets.STAGING_PHOTO_FOLDER_ID }}
          SPREADSHEET_ID: ${{ github.ref_name == 'prod' && secrets.PROD_SPREADSHEET_ID || secrets.STAGING_SPREADSHEET_ID }}
          WRITE_TARGETS: ${{ github.ref_name == 'prod' && secrets.PROD_WRITE_TARGETS || secrets.STAGING_WRITE_TARGETS }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::admin token secret is not set for ${{ steps.env.outputs.name }}."
            exit 1
          fi
          # Checked before anything is pushed, so a bad secret cannot take the forms down.
          case "$WRITE_TARGETS" in
            legacy,monthly|monthly) ;;
            "") echo "::error::${{ steps.env.outputs.name }} WRITE_TARGETS secret is not set. Expected 'legacy,monthly' or 'monthly'."; exit 1 ;;
            *)  echo "::error::${{ steps.env.outputs.name }} WRITE_TARGETS secret is '$WRITE_TARGETS'; expected 'legacy,monthly' or 'monthly'."; exit 1 ;;
          esac
          for KEY in SPREADSHEET_FOLDER_ID PHOTO_FOLDER_ID SPREADSHEET_ID WRITE_TARGETS; do
            VALUE="${!KEY}"
            if [ -z "$VALUE" ]; then
              echo "::error::${{ steps.env.outputs.name }} $KEY secret is not set."
              exit 1
            fi
            OUT=$(curl -sL --max-time 120 --get "$URL" \
                    --data-urlencode "action=setScriptProperty" \
                    --data-urlencode "token=$TOKEN" \
                    --data-urlencode "key=$KEY" \
                    --data-urlencode "value=$VALUE")
            if ! echo "$OUT" | grep -q '"status":"ok"'; then
              echo "$OUT" | head -c 600; echo
              if echo "$OUT" | grep -q '"status":"error"'; then
                echo "::error::could not set $KEY — the web app rejected the request; is the admin token current?"
              else
                echo "::error::could not set $KEY — the web app did not answer with JSON."
              fi
              exit 1
            fi
            echo "set $KEY"
          done

      # Idempotent: creates the current month's operations file so the first write of a month
      # never has to. Runs on every deploy.
      - name: Initialise storage
        env:
          URL: ${{ steps.env.outputs.web_app_url }}
          TOKEN: ${{ github.ref_name == 'prod' && secrets.PROD_ADMIN_TOKEN || secrets.STAGING_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          OUT=$(curl -sL --max-time 300 --get "$URL" \
                  --data-urlencode "action=init" --data-urlencode "token=$TOKEN")
          echo "$OUT" | head -c 800; echo
          [ "$(jq -r '.status // empty' <<<"$OUT" 2>/dev/null)" = ok ] \
            || { echo "::error::init failed — see the response above."; exit 1; }

      - name: Verify deployment is live and bound to the right stores
        env:
          URL: ${{ steps.env.outputs.web_app_url }}
          TOKEN: ${{ github.ref_name == 'prod' && secrets.PROD_ADMIN_TOKEN || secrets.STAGING_ADMIN_TOKEN }}
          SPREADSHEET_ID: ${{ github.ref_name == 'prod' && secrets.PROD_SPREADSHEET_ID || secrets.STAGING_SPREADSHEET_ID }}
          SPREADSHEET_FOLDER_ID: ${{ github.ref_name == 'prod' && secrets.PROD_SPREADSHEET_FOLDER_ID || secrets.STAGING_SPREADSHEET_FOLDER_ID }}
        run: |
          set -euo pipefail
          OUT=$(curl -sL --max-time 120 --get "$URL" \
                  --data-urlencode "action=ping" --data-urlencode "token=$TOKEN")
          echo "$OUT" | head -c 1200; echo
          jq -e . <<<"$OUT" >/dev/null 2>&1 \
            || { echo "::error::ping did not return JSON — deployment is not serving."; exit 1; }
          [ "$(jq -r .status <<<"$OUT")" = ok ] \
            || { echo "::error::ping did not return ok."; exit 1; }

          # The monthly store: the folder this deploy is bound to, and the current month's file.
          [ "$(jq -r '.folder_id // empty' <<<"$OUT")" = "$SPREADSHEET_FOLDER_ID" ] \
            || { echo "::error::deployment is bound to a different operations folder than the ${{ steps.env.outputs.name }} secret specifies ($(jq -r '.folder_error // "no folder_error"' <<<"$OUT"))."; exit 1; }
          EXPECTED="$(TZ=America/New_York date +%Y-%m) Operations"
          [ "$(jq -r '.current_month.name // empty' <<<"$OUT")" = "$EXPECTED" ] \
            || { echo "::error::current month file is not '$EXPECTED'."; exit 1; }
          [ -n "$(jq -r '.current_month.id // empty' <<<"$OUT")" ] \
            || { echo "::error::the current month file does not exist; the init step should have created it."; exit 1; }

          # The reconcile step pushed WRITE_TARGETS from the secret; the backend must now see it.
          TARGETS=$(jq -r '.write_targets // empty' <<<"$OUT")
          case "$TARGETS" in
            legacy,monthly|monthly) ;;
            "") echo "::error::the backend reports no WRITE_TARGETS although the reconcile step set it; check the ${{ steps.env.outputs.name }} WRITE_TARGETS secret."; exit 1 ;;
            *)  echo "::error::the backend reports WRITE_TARGETS '$TARGETS'; expected 'legacy,monthly' or 'monthly'."; exit 1 ;;
          esac

          # The legacy sheet stays asserted while it is still a write target.
          if [[ "$TARGETS" == *legacy* ]]; then
            [ "$(jq -r '.sheet_id // empty' <<<"$OUT")" = "$SPREADSHEET_ID" ] \
              || { echo "::error::legacy write target is a different spreadsheet than the ${{ steps.env.outputs.name }} secret specifies."; exit 1; }
          fi

          {
            echo "### ${{ steps.env.outputs.name }} storage"
            echo "- write targets: \`$TARGETS\`"
            echo "- current month: [$(jq -r .current_month.name <<<"$OUT")]($(jq -r .current_month.url <<<"$OUT"))"
          } >> "$GITHUB_STEP_SUMMARY"

      # A real write is the only thing that catches the failure mode that took production
      # down in Aug 2026 (reads fine, writes denied). Staging only: production has no
      # write-then-clean endpoint, so a synthetic row there would pollute the HACCP record.
      # The row is dated today in New York so it files into the current month, and that
      # month's Deliveries tab must grow by exactly one row: that is what proves the write
      # reached the monthly store and not only the legacy sheet.
      - name: Verify writes (staging only)
        if: github.ref_name == 'dev'
        env:
          URL: ${{ steps.env.outputs.web_app_url }}
          TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          storage_rows() {
            curl -sL --max-time 120 --get "$URL" \
              --data-urlencode "action=storageStatus" --data-urlencode "token=$TOKEN" \
              | jq -r '.months[0].rows.Deliveries // 0'
          }
          BEFORE=$(storage_rows)
          TODAY=$(TZ=America/New_York date +%F)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          ID=$(python3 -c 'import uuid; print(uuid.uuid4())')
          cat > payload.json <<JSON
          {"formType":"delivery","rows":[{
            "submissionId":"$ID","clientTimestamp":"$NOW","date":"$TODAY",
            "driver":"ZZ-CI-SMOKE","store":"0000","storeId":"0000","arrive":"00:00","arrivalTemp":"38",
            "coolerTemp":"38","dish":"ZZ-CI-SMOKE",
            "casePrefillPercent":"0-25%","added":"0","before":"0","removed":"0",
            "reason":"","after":"0","notes":"CI smoke test run ${{ github.run_id }} - safe to delete",
            "receivedBy":"ZZ-CI-SMOKE","formType":"delivery"}]}
          JSON
          OUT=$(curl -sL --max-time 150 "$URL" \
                 -H 'Content-Type: text/plain;charset=utf-8' --data-binary @payload.json)
          echo "$OUT"
          [ "$(jq -r '.status // empty' <<<"$OUT" 2>/dev/null)" = ok ] \
            || { echo "::error::staging write failed — backend accepted no data."; exit 1; }
          AFTER=$(storage_rows)
          [ "$AFTER" -eq "$((BEFORE + 1))" ] \
            || { echo "::error::the monthly Deliveries tab did not grow by one row ($BEFORE -> $AFTER); the write did not reach the monthly store."; exit 1; }
          echo "monthly Deliveries rows: $BEFORE -> $AFTER (submission $ID)"

  # ───────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Site (prod at /, dev at /staging/)
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # A Pages deploy replaces the ENTIRE site, so the artifact must always contain both
      # halves regardless of which branch triggered this run.
      - name: Check out prod
        uses: actions/checkout@v4
        with:
          ref: prod
          path: prod-src

      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src

      - name: Assemble site
        env:
          PROD_URL: ${{ secrets.PROD_WEB_APP_URL }}
          STAGING_URL: ${{ secrets.STAGING_WEB_APP_URL }}
        run: |
          set -euo pipefail

          for b in prod-src dev-src; do
            [ -d "$b/frontend" ] || { echo "::error::$b has no frontend/ — restructure that branch first."; exit 1; }
          done

          # prod -> site root. frontend/ is FLATTENED: every printed QR code depends on
          # the served URL containing no /frontend/ segment.
          mkdir -p _site
          cp -r prod-src/frontend/. _site/
          cp -r prod-src/data       _site/data

          # dev -> /staging/
          mkdir -p _site/staging
          cp -r dev-src/frontend/. _site/staging/
          cp -r dev-src/data       _site/staging/data

          # Each tree gets its own config.js. The browser has no environment to read, so
          # the endpoint is written into a file here and every page reads window.APP_CONFIG
          # from it. Nothing in git holds a Web App URL, so a form cannot inherit the wrong
          # backend by being copied to the wrong directory.
          if [ -z "$PROD_URL" ] || [ -z "$STAGING_URL" ]; then
            echo "::error::PROD_WEB_APP_URL / STAGING_WEB_APP_URL secrets are not set."
            exit 1
          fi
          write_config() {
            printf 'window.APP_CONFIG = {\n  "environment": "%s",\n  "webAppUrl": "%s"\n};\n' "$1" "$2" > "$3"
          }
          write_config production "$PROD_URL"    _site/config.js
          write_config staging    "$STAGING_URL" _site/staging/config.js

          # No page may carry its own endpoint. This is the guard the old string-replace
          # lacked: it caught only the exact production URL, so the bug-report handler's
          # stale one survived into both trees unnoticed.
          if grep -rn --include='*.html' --include='*.js' -F 'script.google.com/macros' _site \
               | grep -v '^_site/config.js:' | grep -v '^_site/staging/config.js:'; then
            echo "::error::Hardcoded Apps Script URL above. Read it from window.APP_CONFIG instead."
            exit 1
          fi

          # Stamp cache-busters. __BUILD_ID__ has no valid runtime value, so both a missing
          # token and a surviving one are build failures rather than something that ships
          # looking fine. This replaces the hand-bumped ?v=N nobody remembered to change.
          STAMP=$(grep -rl -F '__BUILD_ID__' _site || true)
          if [ -z "$STAMP" ]; then
            echo "::error::No __BUILD_ID__ tokens found — cache-busting would silently no-op."
            exit 1
          fi
          echo "$STAMP" | xargs sed -i "s|__BUILD_ID__|${GITHUB_SHA}|g"
          if grep -rq -F '__BUILD_ID__' _site; then
            echo "::error::__BUILD_ID__ survived stamping."
            exit 1
          fi

          # The /staging/ banner is not injected here — frontend/env-banner.js renders it
          # from APP_CONFIG.environment. See the comment in that file for why.

          # Actions mode does not run Jekyll, but be explicit.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
